<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Gury</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>

    <!-- HEADER dinámico -->
    <div id="header-placeholder"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container">

        <!-- Logo -->
        <section class="logo-section">
            <img src="assets/logo.png" alt="Logo Gury">
        </section>

        <!-- Opciones -->
        <section class="options">

            <div class="card">
                <img src="/assets/icon-medicos.png" alt="">
                <p>Médicos generales</p>
            </div>

            <div class="card">
                <img src="/assets/icon-agenda.png" alt="">
                <p>Opciones de agenda</p>
            </div>

            <div class="card">
                <img src="/assets/icon-pacientes.png" alt="">
                <p>Pacientes contentos</p>
            </div>

            <div class="card">
                <img src="/assets/icon-especialistas.png" alt="">
                <p>Especialistas</p>
            </div>

        </section>

        <!-- Botón -->
        <section class="cta">
            <button onclick="window.location.href='pages/citas.html'">
                Agendar una cita
            </button>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/main.js"></script>
</body>
</html>
