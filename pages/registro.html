<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Gury</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="../styles/registro.css">
    <link rel="icon" type="image/png" href="../assets/icon.png">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <h2>Registro</h2>
        <form id="form-registro">
            <div style="text-align: center; margin-bottom: 20px; grid-column: span 2;">
            <img src="../assets/logo.png" alt="Logo Clínica Gury" style="max-width: 180px;">
            </div>
            <input type="text" id="reg-nombre" placeholder="Nombre" required>
            <input type="text" id="reg-apellido" placeholder="Apellido" required>
            <input type="text" id="reg-curp" placeholder="CURP" required>
            <input type="tel" id="reg-celular" placeholder="Celular">
            <input type="password" id="reg-password" placeholder="Contraseña" required>
            
            <button type="button" id="btn-registrar">Registrarme</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/main.js"></script>
</body>
</html>
