<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Gury Clínica</title>
    <link rel="stylesheet" href="../styles/dashboard-medico.css"> 
    <link rel="stylesheet" href="../styles/reportes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/icon.png">
</head>
<body class="dashboard">

    <aside class="sidebar" id="sidebar-placeholder"></aside>

    <main class="main-content">
        <header class="main-header">
            <div class="main-header__welcome">
                <h1>Reportes y Estadísticas</h1>
                <p>Análisis de rendimiento histórico de tus consultas.</p>
            </div>
        </header>

        <section class="metrics">
            <div class="metrics__card">
                <div class="metrics__icon"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="metrics__info">
                    <h3 id="rep-total">0</h3>
                    <p>Total de Citas Históricas</p>
                </div>
            </div>
            <div class="metrics__card metrics__card--atendidas">
                <div class="metrics__icon"><i class="fa-solid fa-check-double"></i></div>
                <div class="metrics__info">
                    <h3 id="rep-completadas">0</h3>
                    <p>Citas Completadas</p>
                </div>
            </div>
            <div class="metrics__card metrics__card--pendientes">
                <div class="metrics__icon" style="color: #f39c12;"><i class="fa-solid fa-user-clock"></i></div>
                <div class="metrics__info">
                    <h3 id="rep-pendientes">0</h3>
                    <p>Citas Pendientes</p>
                </div>
            </div>
        </section>

        <section class="charts-section">
            <div class="chart-container">
                <h2>Distribución de Citas por Estado</h2>
                <canvas id="graficaEstados"></canvas> 
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <script src="../js/supabase-config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
