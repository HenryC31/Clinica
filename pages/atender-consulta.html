<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atender Consulta - Gury Clínica</title>
    <link rel="stylesheet" href="../styles/dashboard-medico.css">
    <link rel="stylesheet" href="../styles/perfil.css"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="../assets/icon.png">

</head>
<body class="dashboard">

    <aside class="sidebar" id="sidebar-placeholder"></aside>

    <main class="main-content">
        <div class="perfil-container" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                <button onclick="window.location.href='dashboard-medico.html'" style="background: none; border: none; color: #3bb3b6; font-size: 20px; cursor: pointer;">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h2 style="margin: 0; text-align: left;">Registro de Consulta Clínica</h2>
            </div>
            
            <div style="background-color: #f0fbfb; padding: 15px; border-radius: 8px; margin-bottom: 25px; border-left: 5px solid #3bb3b6;">
                <strong style="color: #333; font-size: 16px;" id="info-paciente">Cargando datos del paciente...</strong>
                <p style="margin: 5px 0 0 0; color: #666; font-size: 14px;" id="info-alergias">Antecedentes: Cargando...</p>
            </div>

            <form id="form-consulta">
                <div class="form-group">
                    <label><i class="fa-solid fa-notes-medical" style="color: #3bb3b6; margin-right: 5px;"></i> Síntomas y Motivo de Consulta</label>
                    <textarea id="cons-sintomas" placeholder="Ej. Paciente presenta dolor de cabeza agudo, fiebre de 38.5°C y malestar general..." required style="height: 100px; resize: none;"></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-file-medical" style="color: #3bb3b6; margin-right: 5px;"></i> Diagnóstico Médico</label>
                    <textarea id="cons-diagnostico" placeholder="Ej. Infección de vías respiratorias superiores..." required style="height: 80px; resize: none;"></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-prescription-bottle-medical" style="color: #3bb3b6; margin-right: 5px;"></i> Tratamiento / Prescripción (Receta)</label>
                    <textarea id="cons-tratamiento" placeholder="Ej. Paracetamol 500mg cada 8 horas por 3 días..." required style="height: 120px; resize: none;"></textarea>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-comment-medical" style="color: #3bb3b6; margin-right: 5px;"></i> Notas Adicionales / Observaciones</label>
                    <textarea id="cons-notas" placeholder="Ej. Se recomienda reposo absoluto y acudir a urgencias en caso de que la fiebre no ceda..." style="height: 70px; resize: none;"></textarea>
                </div>

                <button type="button" class="btn-guardar" id="btn-guardar-consulta" style="background-color: #3bb3b6; font-weight: bold;">Finalizar Consulta y Guardar Expediente</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/main.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/atender-consulta.js"></script>
</body>
</html>
