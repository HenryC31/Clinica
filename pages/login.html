<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión - Gury</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="icon" type="image/png" href="../assets/icon.png">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <h2>Inicio de Sesión</h2>
        <form id="form-login">
            <div style="text-align: center; margin-bottom: 20px;">
            <!-- Ajusta la ruta si tu logo se llama diferente en la carpeta assets -->
            <img src="../assets/logo.png" alt="Logo Clínica Gury" style="max-width: 180px;">
            </div>
            <input type="text" id="login-curp" placeholder="CURP" required>
            <input type="password" id="login-pass" placeholder="Contraseña" required>
            
            <button type="button" id="btn-login" onclick="iniciarSesion()">Continuar</button>
        </form>
        <p>¿Aún no tienes cuenta? <a href="registro.html">¡Crea Una!</a></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
